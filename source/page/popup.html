<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pine - Sắp xếp dấu trang</title>
    <link rel="stylesheet" href="/css/modern.css">
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-family);
        }
        .popup-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .popup-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .popup-logo {
            width: 24px;
            height: 24px;
        }
        .popup-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .popup-version {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .popup-header-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            transition: all 0.15s ease;
        }
        .popup-header-btn:hover {
            color: var(--primary-blue);
            background-color: var(--nav-hover-bg);
        }
        .popup-header-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .popup-btn-sort {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.25);
        }
        .popup-stats-strip {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            background-color: var(--bg-page);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            font-size: 12px;
        }
        .popup-stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }
        .popup-stat-num {
            font-weight: 700;
            color: var(--text-primary);
        }
        .popup-card {
            background-color: var(--bg-page);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .popup-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .popup-row-label {
            color: var(--text-primary);
            font-weight: 500;
        }
        .popup-nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .popup-nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            background-color: var(--bg-page);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .popup-nav-link:hover {
            color: var(--primary-blue);
            background-color: var(--primary-blue-light);
            border-color: var(--primary-blue);
        }
        .popup-nav-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="light">

    <div class="popup-container">
        <!-- Header -->
        <div class="popup-header">
            <div class="popup-brand">
                <svg class="popup-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="6" width="18" height="4" rx="2" fill="#F43F5E"/>
                    <rect x="4" y="14" width="24" height="4" rx="2" fill="#F59E0B"/>
                    <rect x="4" y="22" width="14" height="4" rx="2" fill="#3B82F6"/>
                    <circle cx="23" cy="24" r="2.5" fill="#3B82F6"/>
                </svg>
                <span class="popup-title">Pine</span>
                <span class="popup-version" id="popup-version">v2026.11.1</span>
            </div>
            <button type="button" class="popup-header-btn" id="btn-open-options" title="Mở trang cài đặt đầy đủ">
                <span data-icon="options" data-size="18"></span>
            </button>
        </div>

        <!-- Big Sort Button -->
        <button type="button" class="btn btn-primary popup-btn-sort btn-sort-now" id="btn-popup-sort">
            <span data-icon="sort" data-size="16"></span>
            <span>Sắp xếp toàn bộ ngay</span>
        </button>

        <!-- Quick Organization & Sort Audit Indicator -->
        <div class="popup-audit-strip" id="popup-audit-strip" title="Bấm để mở trang Đánh giá & Kiểm định sắp xếp">
            <div class="popup-audit-left">
                <span class="audit-mini-dot excellent" id="popup-audit-dot"></span>
                <span id="popup-audit-text">Đang kiểm tra trật tự...</span>
            </div>
            <span class="popup-audit-badge excellent" id="popup-audit-badge">--%</span>
        </div>

        <!-- Mini Stats Strip -->
        <div class="popup-stats-strip">
            <div class="popup-stat-item">
                <span data-icon="bookmark" data-size="14" data-color="#1a73e8"></span>
                <span class="popup-stat-num" id="popup-stat-bookmarks"><span class="skeleton skeleton-text sm" style="width: 28px; margin: 0;"></span></span>
                <span>dấu trang</span>
            </div>
            <div style="color: var(--border-color)">•</div>
            <div class="popup-stat-item">
                <span data-icon="folder" data-size="14" data-color="#f59e0b"></span>
                <span class="popup-stat-num" id="popup-stat-folders"><span class="skeleton skeleton-text sm" style="width: 24px; margin: 0;"></span></span>
                <span>thư mục</span>
            </div>
        </div>

        <!-- Quick Toggles -->
        <div class="popup-card">
            <div class="popup-row">
                <span class="popup-row-label">Tự động sắp xếp</span>
                <label class="switch">
                    <input type="checkbox" id="popup-opt-auto-sort">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="popup-row">
                <span class="popup-row-label">Thư mục luôn ở trước</span>
                <label class="switch">
                    <input type="checkbox" id="popup-opt-group-folders">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Quick Navigation Grid -->
        <div class="popup-nav-grid">
            <a class="popup-nav-link" data-url="/page/options.html">
                <span data-icon="options" data-size="16"></span>
                <span>Cơ bản</span>
            </a>
            <a class="popup-nav-link" data-url="/page/rules.html">
                <span data-icon="rules" data-size="16"></span>
                <span>Kiểu thư mục</span>
            </a>
            <a class="popup-nav-link" data-url="/page/audit.html">
                <span data-icon="audit" data-size="16"></span>
                <span>Đánh giá</span>
            </a>
            <a class="popup-nav-link" data-url="/page/stats.html">
                <span data-icon="stats" data-size="16"></span>
                <span>Thống kê</span>
            </a>
            <a class="popup-nav-link" data-url="/page/tools-empty.html">
                <span data-icon="cleanup" data-size="16"></span>
                <span>Dọn dẹp rác</span>
            </a>
            <a class="popup-nav-link" data-url="/page/sync.html">
                <span data-icon="sync" data-size="16"></span>
                <span>Đồng bộ</span>
            </a>
        </div>
    </div>

    <script src="/js/browser-polyfill.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/page/pine-core.js"></script>
    <script src="/js/page/popup.js"></script>
</body>
</html>
